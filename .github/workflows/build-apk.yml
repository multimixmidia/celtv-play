name: Build APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Preparar APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/CeltvPlay.apk

      - name: Publicar Release (link fixo)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app
          name: Celtv Play (APK)
          files: dist/CeltvPlay.apk

      - name: Artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: CeltvPlay-apk
          path: dist/CeltvPlay.apk
