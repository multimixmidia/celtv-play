name: Build APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Chave de assinatura
        run: echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > "${{ github.workspace }}/celtv.keystore"

      - name: Build APK assinado
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/celtv.keystore
          KEYSTORE_PASS: celtvplay
          KEY_ALIAS: celtv
          KEY_PASS: celtvplay
        run: gradle assembleRelease --no-daemon --stacktrace -PverCode=${{ github.run_number }} -PverName=1.${{ github.run_number }}

      - name: Preparar APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/CeltvPlay.apk

      - name: Publicar Release (link fixo)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app
          name: Celtv Play (APK)
          files: dist/CeltvPlay.apk

      - name: Artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: CeltvPlay-apk
          path: dist/CeltvPlay.apk
